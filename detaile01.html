<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소파 상세 페이지</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      img {
        display: block;
        width: 100%;
        max-width: 1200px;
        object-fit: contain;
      }
      header {
        width: 100%;
        height: 64px;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        background-color: rgba(51, 51, 51, 0.6);
        backdrop-filter: blur(10px);
        color: #ddd;
      }
      header h1 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      header p {
        font-size: 13px;
      }
      main {
        width: 100%;
        padding-top: 64px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      main p {
        width: 100%;
        background-color: bisque;
        font-weight: bold;
        font-size: 18px;
        margin: auto 0;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
      }
      /* 모바일 폰트 크기 수정 */
      @media screen and (max-width: 768px) {
        main p {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>상세페이지 - Auris 가죽 소파</h1>
      <p>©2025.Kim Yeeun. All Rights Reserved</p>
    </header>
    <main>
      <p>
        본 상세페이지는 포트폴리오 목적으로 제작된 것이며, 사용된 브랜드는
        가상의 브랜드이고, 이미지 역시 AI를 통해 생성된 것임을 알려드립니다
      </p>
      <img src="img/detail01/01 상세페이지.jpg" alt="상세페이지1" />
      <img src="img/detail01/02 메모리폼.gif" alt="상세페이지2" />
      <img src="img/detail01/03 가죽합판.jpg" alt="상세페이지3" />
      <img src="img/detail01/04 사이즈.jpg" alt="상세페이지4" />
    </main>
  </body>
</html>
